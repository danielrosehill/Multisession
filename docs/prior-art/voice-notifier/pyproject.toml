[project]
name = "claude-voice-notifier"
version = "0.1.0"
description = "Claude places a real outbound phone call and delivers one specific, one-time message on your behalf."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Tier 1 only. Tier 0 (the announcement call) needs nothing beyond the stdlib
# and jsonschema, which is the point of tier 0 — see docs/plan.md, D8.
relay = [
    "websockets>=12.0",
    "anthropic>=0.40",
]

[project.scripts]
voice-notifier = "voice_notifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_notifier"]
